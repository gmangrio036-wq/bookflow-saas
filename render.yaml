services:
  - type: web
    name: bookflow-saas
    env: node
    plan: free
    buildCommand: npm install && npm --prefix server install && npm --prefix client install && npm run build
    startCommand: NODE_ENV=production node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://bookflow-saas.netlify.app
      - key: STRIPE_SECRET_KEY
        sync: false
